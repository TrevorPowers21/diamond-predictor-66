name: CI

# Three gates on every PR:
#   1. tests      — the vitest suite, including the ANCHOR SUITE (25 real prod players)
#   2. types      — tsc against tsconfig.app.json, compared delta-vs-base
#   3. read-path  — scripts/agent/stat-surface-map.ts, also delta-vs-base
#   4. drift      — scripts/agent/migration-drift.ts against STAGING's real catalog
#
# Gate 3 exists because 2026-09-01's bugs lived in the READ PATH: every database check passed while
# the screen was wrong. It flags a user-facing stat read from `.prediction` inside the team-builder
# row shape — `snapshot ?? predictionMap[...]`, which silently degrades to a raw prediction row.
# Needs no database, so it runs with no secrets.
#
# Gate 4 needs a database, and uses the STAGING_PGURI secret — a `ci_readonly` role that can read the
# CATALOG and nothing else: no table grants, not superuser, cannot create roles. It exists because a
# CI secret that can write to a database is fine until it isn't. See
# scripts/agent/create-ci-readonly-role.ts.
#
# Why delta-vs-base rather than "zero errors": the app carries a large
# pre-existing tsc error baseline. Gating on zero would fail every PR forever;
# gating on the delta fails only PRs that ADD errors, which is the thing worth
# blocking. See CLAUDE.md "Watch Out For" for why `tsc --noEmit` alone is a
# no-op here (root tsconfig has files:[] + project references).

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # setup-node's `cache: npm` caches the npm download cache (~/.npm), which
      # still leaves `npm ci` doing the full install work. Caching node_modules
      # itself, keyed on the lockfile, lets us skip the install entirely on a
      # hit — the common case, since the lockfile changes far less often than
      # the source.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run test suite
        run: npm test

  types:
    name: types (tsc delta-vs-base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need both sides of the comparison, so no shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same cache and key as the `tests` job — they share the entry, so
      # whichever job runs first populates it for the other.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type-check HEAD
        id: head
        run: |
          set +e
          ./node_modules/.bin/tsc -p tsconfig.app.json --noEmit > /tmp/head.raw 2>&1
          set -e
          # Normalise to file|code|message — line/col are stripped so that
          # unrelated line shifts don't register as new errors.
          grep -E "error TS[0-9]+" /tmp/head.raw \
            | sed -E 's/\(([0-9]+),([0-9]+)\)//' \
            | sed -E 's/^(.*): error (TS[0-9]+): (.*)$/\1|\2|\3/' \
            | sort > /tmp/head.errors || true
          echo "count=$(wc -l < /tmp/head.errors | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Type-check base
        id: base
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-parse origin/staging)
          fi
          echo "Base commit: $BASE_SHA"

          git worktree add /tmp/base "$BASE_SHA"
          # Reuse the installed deps rather than a second npm ci. Type errors
          # come from the source tree, and a duplicate install would roughly
          # double the job's runtime.
          ln -s "$PWD/node_modules" /tmp/base/node_modules

          cd /tmp/base
          set +e
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" -p tsconfig.app.json --noEmit > /tmp/base.raw 2>&1
          set -e
          grep -E "error TS[0-9]+" /tmp/base.raw \
            | sed -E 's/\(([0-9]+),([0-9]+)\)//' \
            | sed -E 's/^(.*): error (TS[0-9]+): (.*)$/\1|\2|\3/' \
            | sort > /tmp/base.errors || true
          echo "count=$(wc -l < /tmp/base.errors | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Compare
        run: |
          BASE_N="${{ steps.base.outputs.count }}"
          HEAD_N="${{ steps.head.outputs.count }}"

          # Set difference, not just a count comparison — a PR that fixes one
          # error and introduces another leaves the count unchanged.
          comm -13 /tmp/base.errors /tmp/head.errors > /tmp/new.errors || true
          NEW_N=$(wc -l < /tmp/new.errors | tr -d ' ')

          comm -23 /tmp/base.errors /tmp/head.errors > /tmp/fixed.errors || true
          FIXED_N=$(wc -l < /tmp/fixed.errors | tr -d ' ')

          {
            echo "### tsc delta-vs-base"
            echo ""
            echo "| | count |"
            echo "|---|---|"
            echo "| base ($BASE_N) | \`$BASE_N\` |"
            echo "| head | \`$HEAD_N\` |"
            echo "| **new** | **\`$NEW_N\`** |"
            echo "| fixed | \`$FIXED_N\` |"
            echo ""
            if [ "$FIXED_N" -gt 0 ]; then
              echo "<details><summary>Fixed ($FIXED_N)</summary>"
              echo ""
              echo '```'
              cat /tmp/fixed.errors
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi
            if [ "$NEW_N" -gt 0 ]; then
              echo "**New type errors introduced by this PR:**"
              echo ""
              echo '```'
              cat /tmp/new.errors
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$NEW_N" -gt 0 ]; then
            echo "::error::$NEW_N new type error(s) introduced by this PR"
            cat /tmp/new.errors
            exit 1
          fi

          echo "No new type errors. Baseline: $BASE_N, head: $HEAD_N, fixed: $FIXED_N."

  read-path:
    name: read-path (stat-map delta-vs-base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Both sides of the comparison, so no shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same cache and key as the other jobs — they share the entry.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Scan HEAD
        run: npx tsx scripts/agent/stat-surface-map.ts --porcelain | sort > /tmp/head.readpath

      - name: Scan base
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then BASE_SHA=$(git rev-parse origin/staging); fi
          echo "Base commit: $BASE_SHA"

          git worktree add /tmp/base "$BASE_SHA"
          ln -s "$PWD/node_modules" /tmp/base/node_modules

          # The base may predate the script existing — that is a legitimate empty baseline, not a
          # failure, so every finding on HEAD would then be new. Guard so the job reports rather
          # than crashing.
          # Two ways the base can legitimately have no comparable baseline, and BOTH must be
          # handled explicitly. A base that does not understand --porcelain will happily print its
          # human-readable report instead, which sorts into dozens of junk lines and makes the diff
          # meaningless — it reads as "everything fixed, everything new". Caught by simulating this
          # job locally before shipping it.
          if [ ! -f /tmp/base/scripts/agent/stat-surface-map.ts ]; then
            echo "stat-surface-map.ts does not exist on the base commit — empty baseline."
            : > /tmp/base.readpath
          elif ! grep -q -- "--porcelain" /tmp/base/scripts/agent/stat-surface-map.ts; then
            echo "Base's stat-surface-map.ts predates --porcelain — empty baseline."
            echo "::notice::Read-path baseline is empty; every finding on HEAD will read as new until this lands on the base branch."
            : > /tmp/base.readpath
          else
            (cd /tmp/base && npx tsx scripts/agent/stat-surface-map.ts --porcelain | sort > /tmp/base.readpath)
          fi

      - name: Compare
        run: |
          # Set difference, not a count: a PR that fixes one finding and adds another leaves the
          # count unchanged. Same reasoning as the tsc job.
          comm -13 /tmp/base.readpath /tmp/head.readpath > /tmp/new.readpath || true
          comm -23 /tmp/base.readpath /tmp/head.readpath > /tmp/fixed.readpath || true
          NEW_N=$(wc -l < /tmp/new.readpath | tr -d ' ')
          FIXED_N=$(wc -l < /tmp/fixed.readpath | tr -d ' ')
          BASE_N=$(wc -l < /tmp/base.readpath | tr -d ' ')

          {
            echo "### read-path (stat-map delta-vs-base)"
            echo ""
            echo "A user-facing stat read from \`.prediction\` in the team-builder row shape."
            echo "That field is \`snapshot ?? predictionMap[...]\` and degrades to a raw prediction row."
            echo ""
            echo "| | count |"
            echo "|---|---|"
            echo "| base | \`$BASE_N\` |"
            echo "| **new** | **\`$NEW_N\`** |"
            echo "| fixed | \`$FIXED_N\` |"
            if [ "$FIXED_N" -gt 0 ]; then
              echo ""
              echo "<details><summary>Fixed ($FIXED_N)</summary>"
              echo ""; echo '```'; cat /tmp/fixed.readpath; echo '```'; echo ""
              echo "</details>"
            fi
            if [ "$NEW_N" -gt 0 ]; then
              echo ""
              echo "**New read-path findings introduced by this PR:**"
              echo ""; echo '```'; cat /tmp/new.readpath; echo '```'
              echo ""
              echo "Read the stored snapshot instead: \`player_snapshot ?? transfer_snapshot\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # An empty baseline means the comparison could not be made, not that this PR introduced
          # everything. Report loudly, do not block — otherwise the PR that INTRODUCES this gate can
          # never pass it.
          if [ ! -s /tmp/base.readpath ] && [ "$NEW_N" -gt 0 ]; then
            echo "::warning::No comparable baseline on the base branch. $NEW_N finding(s) reported, not blocking."
            cat /tmp/new.readpath
            exit 0
          fi

          if [ "$NEW_N" -gt 0 ]; then
            echo "::error::$NEW_N new read-path finding(s) — a stat is being read from .prediction"
            cat /tmp/new.readpath
            exit 1
          fi

          echo "No new read-path findings. Baseline: $BASE_N, fixed: $FIXED_N."

  drift:
    name: drift (migrations vs catalog)
    runs-on: ubuntu-latest
    # A fork PR cannot read secrets, so this job would fail for a reason that has nothing to do with
    # the change. Skip rather than fail — and say so, so a green tick is never mistaken for a pass
    # that did not happen.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check the secret is present
        env:
          PGURI: ${{ secrets.STAGING_PGURI }}
        run: |
          if [ -z "$PGURI" ]; then
            echo "::error::STAGING_PGURI is not set. Create it with scripts/agent/create-ci-readonly-role.ts"
            exit 1
          fi
          echo "STAGING_PGURI present."

      - name: Migration drift vs STAGING catalog
        env:
          PGURI: ${{ secrets.STAGING_PGURI }}
        run: |
          # The script reads .env.local, which does not exist in CI. Write one containing ONLY the
          # read-only URL. Gitignored, and the runner is destroyed after the job.
          printf 'PGURI=%s\n' "$PGURI" > .env.local

          set +e
          npx tsx scripts/agent/migration-drift.ts > /tmp/drift.txt 2>&1
          RC=$?
          set -e
          cat /tmp/drift.txt

          # KIND MISMATCH is the blocking signal: an object exists under a declared name but as a
          # DIFFERENT KIND of thing. A later migration dropping something explains a MISSING object;
          # nothing explains that. Known count on staging is 1 (the June
          # team_build_players_unique_player_role file). Anything above that is new.
          MISMATCH=$(grep -oE "KIND MISMATCH \(([0-9]+)\)" /tmp/drift.txt | head -1 | grep -oE "[0-9]+" || echo 0)
          KNOWN=1

          {
            echo "### drift (migrations vs STAGING catalog)"
            echo ""
            echo "| | count |"
            echo "|---|---|"
            echo "| kind mismatches | \`$MISMATCH\` |"
            echo "| known baseline | \`$KNOWN\` |"
            echo ""
            echo "A KIND MISMATCH means the repo declares an object one way and the database has it"
            echo "another — the repo no longer describes the database. Known: the June"
            echo "\`team_build_players_unique_player_role\` migration."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MISMATCH" -gt "$KNOWN" ]; then
            echo "::error::$MISMATCH kind mismatch(es), above the known baseline of $KNOWN"
            exit 1
          fi
          if [ $RC -ne 0 ]; then
            echo "::error::migration-drift.ts exited $RC"
            exit $RC
          fi
          echo "Drift within the known baseline ($MISMATCH of $KNOWN)."
